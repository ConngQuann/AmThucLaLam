<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page 2.0</title>
    <link rel="stylesheet" href="res.css">
    <style>
        body{
            background-color: rgb(228, 227, 227);
        }

        .signbut{
            height: 50px;
            width: 275px;
            margin-top: 25px;
            background-color: rgb(0, 168, 235);
            border: 10px solid rgb(0,168,235);
            border-radius: 10px;
            color: white;
        }

        .acc{
            text-align: center;
            width: 350px;
            height: 50px;
            font-size: 15px;
        }

        .center{
            display: flex;
            justify-content: center;
        }

        .mainguide{
            width: 100%;
            justify-content: center;
            display: flex;
        }

        .maindis{
            display: flex;
            justify-content: center;
            flex-direction: column;
            background-color: white;
            width: 400px;
            height:320px;
            margin-top: 100px;
            border: 10px solid rgb(255, 255, 255);
            border-radius: 10px;
            box-shadow:0 0 10px 5px rgba(0,0,0,0.1) ;
        }

        .labels{
            display: flex;
            justify-content: center;
            font-size: 40px;
            margin-top: 15px;
        }


    </style>
</head>
<body>
    <div class="mainguide">
    <form class="maindis"
     id="loginForm" 
     action="hello" 
     method="post">
   <label class="labels" for="email">Your Email</label>
  <div class="center">
   <input 
    type="email"
    id="email" 
    name="email" 
    placeholder="..." 
    class="acc" 
    required> 
  </div>

     <!-- password -->
  <label class="labels" for="password">Your Password</label>
  <div class="center">
   <input 
   type="password" 
   id="password" 
   name="password" 
   placeholder="..." 
   class="acc" 
   required> 
  </div>

    <!-- Sign In -->
 <div class="center">
  <button 
  id="signin"
  type="submit" 
  class="signbut">Sign In</button>
 </div>

 </div>
 </form>
 </div>
</body>
</html>
